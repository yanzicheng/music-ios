name: iOS Build

# 瑙﹀彂鏂瑰紡锛?#   1) 鎺ㄩ€佸埌 main 鍒嗘敮锛堟敼浜嗘簮鐮佽嚜鍔ㄥ嚭鍖咃級
#   2) 鍦?Actions 椤甸潰鎵嬪姩 Run workflow
on:
  push:
    branches: [ main, master ]
    paths-ignore:
      - '**.md'
  workflow_dispatch:

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------
  # Job 1锛氱紪璇戞湭绛惧悕 .app锛堜换浣?Apple 璐﹀彿閮借兘璺戯紝浜х墿鍙洿鎺ョ敤浜?Sideloadly 鑷锛?  # ---------------------------------------------------------------
  build-unsigned:
    name: Build unsigned .app
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Show toolchain info
        run: |
          node -v
          npm -v
          xcodebuild -version
          pod --version || true

      - name: Install npm dependencies
        run: npm install --no-audit --no-fund

      - name: Add iOS platform
        run: npx cordova platform add ios

      - name: Add nodejs-mobile plugin
        run: npx cordova plugin add @red-mobile/nodejs-mobile-cordova

      - name: Sync sources into platform
        run: npx cordova prepare ios

      - name: Verify bundled sources
        run: |
          set -e
          test -f www/index.html                                   || (echo "缂哄皯 www/index.html" && exit 1)
          test -f www/nodejs-project/main.js                       || (echo "缂哄皯 www/nodejs-project/main.js" && exit 1)
          test -f www/nodejs-project/server/index.js                || (echo "缂哄皯 server/index.js" && exit 1)
          test -d www/nodejs-project/闊虫簮                           || (echo "缂哄皯 闊虫簮 鐩綍" && exit 1)
          PLIST=$(find platforms/ios -maxdepth 2 -name "*-Info.plist" | head -n 1)
          if [ -z "$PLIST" ]; then echo "缂哄皯 Info.plist"; exit 1; fi
          echo "--- 闊虫簮鑴氭湰 ---"
          ls -1 www/nodejs-project/闊虫簮
          echo "--- Info.plist: $PLIST 鍏抽敭閿?---"
          grep -E "NSAppTransportSecurity|UIBackgroundModes|UIFileSharingEnabled|CFBundleDisplayName" "$PLIST"

      - name: Build (release, device, unsigned)
        run: |
          set -o pipefail
          FLAGS=(
            --buildFlag="CODE_SIGNING_ALLOWED=NO"
            --buildFlag="CODE_SIGNING_REQUIRED=NO"
            --buildFlag="CODE_SIGN_IDENTITY="
          )
          # --no-sign 鍦ㄩ儴鍒?cordova-ios 鐗堟湰涓婁笉璇嗗埆锛屽け璐ュ垯閫€鍥炵函 buildFlag 鏂瑰紡
          if ! npx cordova build ios --release --device --no-sign "${FLAGS[@]}" 2>&1 | tee build.log; then
            echo "::warning::甯?--no-sign 鐨勬瀯寤哄け璐ワ紝鍘绘帀璇ュ弬鏁伴噸璇?
            npx cordova build ios --release --device "${FLAGS[@]}" 2>&1 | tee -a build.log
          fi

      - name: Package unsigned .app
        run: |
          set -e
          APP=$(find platforms/ios/build -maxdepth 3 -name "*.app" -type d | head -n 1)
          if [ -z "$APP" ]; then echo "鏈壘鍒?.app 浜х墿"; find platforms/ios/build -maxdepth 3 -type d; exit 1; fi
          echo "APP=$APP"
          ditto -c -k --sequesterRsrc --keepParent "$APP" MusicPlayer-unsigned.zip
          ls -lh MusicPlayer-unsigned.zip

      - name: Upload unsigned artifact
        uses: actions/upload-artifact@v4
        with:
          name: MusicPlayer-unsigned
          path: MusicPlayer-unsigned.zip
          retention-days: 14

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          retention-days: 7
          if-no-files-found: ignore

  # ---------------------------------------------------------------
  # Job 2锛堝彲閫夛級锛氱敤 P12 璇佷功 + mobileprovision 鍋?ad-hoc 绛惧悕锛岀洿鎺ュ嚭 .ipa
  # 鏈厤缃?secret 鏃舵湰 job 浼氳嚜鍔ㄨ烦杩囷紝涓嶅奖鍝?Job 1
  # 闇€瑕佺殑 secrets锛歅12_BASE64 / P12_PASSWORD / MOBILEPROVISION_BASE64
  # ---------------------------------------------------------------
  sign-ipa:
    name: Sign IPA (optional)
    needs: build-unsigned
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      P12_BASE64: ${{ secrets.P12_BASE64 }}
      P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
      MOBILEPROVISION_BASE64: ${{ secrets.MOBILEPROVISION_BASE64 }}

    steps:
      - name: Check signing secrets
        id: check
        run: |
          if [ -n "$P12_BASE64" ] && [ -n "$MOBILEPROVISION_BASE64" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "绛惧悕 secret 宸查厤缃紝缁х画鎵ц"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "鏈厤缃?P12_BASE64 / MOBILEPROVISION_BASE64锛岃烦杩囩鍚?job"
          fi

      - name: Download unsigned artifact
        if: steps.check.outputs.enabled == 'true'
        uses: actions/download-artifact@v4
        with:
          name: MusicPlayer-unsigned
          path: unsigned

      - name: Unzip .app
        if: steps.check.outputs.enabled == 'true'
        run: |
          set -e
          cd unsigned
          unzip -q MusicPlayer-unsigned.zip
          APP=$(find . -maxdepth 2 -name "*.app" -type d | head -n 1)
          echo "APP=$APP"
          echo "APP_PATH=$PWD/${APP#./}" >> "$GITHUB_ENV"

      - name: Import certificate & provisioning profile
        if: steps.check.outputs.enabled == 'true'
        run: |
          set -e
          KEYCHAIN=$RUNNER_TEMP/sign.keychain-db
          KEYCHAIN_PASS=$(openssl rand -base64 24)

          echo "$P12_BASE64" | base64 -D > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN"
          security set-keychain-settings -lut 1800 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$P12_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASS" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db

          echo "$MOBILEPROVISION_BASE64" | base64 -D > "$RUNNER_TEMP/profile.mobileprovision"
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp "$RUNNER_TEMP/profile.mobileprovision" ~/Library/MobileDevice/Provisioning\ Profiles/

          # 瀵煎嚭 provisioning profile 鍐呯殑 entitlements锛堝惈 application-identifier / get-task-allow锛?          security cms -D -i "$RUNNER_TEMP/profile.mobileprovision" > "$RUNNER_TEMP/profile.plist"
          plutil -extract Entitlements xml1 -o "$RUNNER_TEMP/entitlements.plist" "$RUNNER_TEMP/profile.plist"

          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN" | head -n 1 | awk '{print $2}')
          echo "绛惧悕韬唤: $IDENTITY"
          echo "CODESIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
          echo "KEYCHAIN_PATH=$KEYCHAIN" >> "$GITHUB_ENV"

      - name: Embed profile & codesign
        if: steps.check.outputs.enabled == 'true'
        run: |
          set -e
          cp "$RUNNER_TEMP/profile.mobileprovision" "$APP_PATH/embedded.mobileprovision"
          # --deep 浼氭妸 App 鍐呭祵鐨?NodeMobile.framework 绛変竴骞堕噸绛?          codesign --force --deep --timestamp=none --sign "$CODESIGN_IDENTITY" \
            --entitlements "$RUNNER_TEMP/entitlements.plist" "$APP_PATH"
          # 鏍￠獙绛惧悕缁撴灉
          codesign -dv --verbose=4 "$APP_PATH" 2>&1 | head -n 20
          codesign --verify --deep --verbose=2 "$APP_PATH"

      - name: Build .ipa
        if: steps.check.outputs.enabled == 'true'
        run: |
          set -e
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -qry MusicPlayer-signed.ipa Payload
          ls -lh MusicPlayer-signed.ipa

      - name: Upload signed IPA
        if: steps.check.outputs.enabled == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: MusicPlayer-ipa
          path: MusicPlayer-signed.ipa
          retention-days: 14

      - name: Cleanup keychain
        if: always()
        run: |
          if [ -n "$KEYCHAIN_PATH" ]; then security delete-keychain "$KEYCHAIN_PATH" || true; fi
