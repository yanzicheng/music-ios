name: iOS Build

# 触发方式：
#   1) 推送到 main 分支（改了源码自动出包）
#   2) 在 Actions 页面手动 Run workflow
on:
  push:
    branches: [ main, master ]
    paths-ignore:
      - '**.md'
  workflow_dispatch:

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------
  # Job 1：编译未签名 .app（任何 Apple 账号都能跑，产物可直接用于 Sideloadly 自签）
  # ---------------------------------------------------------------
  build-unsigned:
    name: Build unsigned .app
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Show toolchain info
        run: |
          node -v
          npm -v
          xcodebuild -version
          pod --version || true

      - name: Install npm dependencies
        run: npm install --no-audit --no-fund

      - name: Add iOS platform
        run: |
          node -v
          npx cordova -v
          npx cordova platform ls || true
          set +e
          npx cordova platform add ios --verbose > /tmp/add-platform.log 2>&1
          RC=$?
          echo "=========== ADD PLATFORM LOG (tail 80) ==========="
          tail -n 80 /tmp/add-platform.log
          if [ $RC -ne 0 ]; then
            MSG=$(tail -n 25 /tmp/add-platform.log | tr -d '\r' | awk '{printf "%s%%0A", $0}')
            echo "::error title=cordova platform add ios failed rc=$RC::$MSG"
            exit $RC
          fi
          npx cordova platform ls

      - name: Add nodejs-mobile plugin
        run: |
          set +e
          npx cordova plugin add @red-mobile/nodejs-mobile-cordova --verbose > /tmp/add-plugin.log 2>&1
          RC=$?
          echo "=========== ADD PLUGIN LOG (tail 60) ==========="
          tail -n 60 /tmp/add-plugin.log
          if [ $RC -ne 0 ]; then
            MSG=$(tail -n 25 /tmp/add-plugin.log | tr -d '\r' | awk '{printf "%s%%0A", $0}')
            echo "::error title=cordova plugin add failed rc=$RC::$MSG"
            exit $RC
          fi

      - name: Sync sources into platform
        run: npx cordova prepare ios

      - name: Verify bundled sources
        run: |
          set -e
          test -f www/index.html                                   || (echo "缺少 www/index.html" && exit 1)
          test -f www/nodejs-project/main.js                       || (echo "缺少 www/nodejs-project/main.js" && exit 1)
          test -f www/nodejs-project/server/index.js                || (echo "缺少 server/index.js" && exit 1)
          test -d www/nodejs-project/音源                           || (echo "缺少 音源 目录" && exit 1)
          PLIST=$(find platforms/ios -maxdepth 2 -name "*-Info.plist" | head -n 1)
          if [ -z "$PLIST" ]; then echo "缺少 Info.plist"; exit 1; fi
          echo "--- 音源脚本 ---"
          ls -1 www/nodejs-project/音源
          echo "--- Info.plist: $PLIST 关键键 ---"
          grep -E "NSAppTransportSecurity|UIBackgroundModes|UIFileSharingEnabled|CFBundleDisplayName" "$PLIST"

      - name: Build (release, device, unsigned)
        run: |
          set -o pipefail
          WS=$(ls -d platforms/ios/*.xcworkspace 2>/dev/null | head -n 1)
          if [ -z "$WS" ]; then echo "未找到 xcworkspace"; ls -la platforms/ios; exit 1; fi
          PROJ=$(basename "$WS" .xcworkspace)
          echo "workspace=$WS  project=$PROJ"
          xcodebuild -list -workspace "$WS" > list.log 2>&1 || true
          tail -n 30 list.log
          # 排除库/依赖 scheme，优先取与工程同名的 app scheme
          SCHEME=$(sed -n '/Schemes:/,$p' list.log | grep -v 'Schemes:' | grep -v 'Build Configurations:' | sed 's/^[[:space:]]*//' | sed 's/[[:space:]]*$//' | grep -v '^$' | grep -vxE "Cordova|CordovaLib|Pods-.*" | head -n 1)
          if [ -z "$SCHEME" ]; then SCHEME="$PROJ"; fi
          echo "scheme=$SCHEME"
          rm -rf platforms/ios/build-dd
          set +e
          xcodebuild -workspace "$WS" -scheme "$SCHEME" -configuration Release -sdk iphoneos \
            -derivedDataPath "$PWD/platforms/ios/build-dd" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" CODE_SIGN_ENTITLEMENTS="" DEVELOPMENT_TEAM="" \
            build > build.log 2>&1
          RC=$?
          if [ $RC -ne 0 ]; then
            echo "===== BUILD FAILED rc=$RC scheme=$SCHEME ====="
            echo "--- error lines ---"
            grep -nE "error:|fatal error|The following build commands failed|BUILD FAILED|Failed to|Command .* failed" build.log | head -n 40
            echo "--- tail 60 ---"
            tail -n 60 build.log
            ERRS=$(grep -E "error:|fatal error|The following build commands failed|BUILD FAILED|Failed to build|Command .* failed" build.log | head -n 25 | tr -d '\r' | cut -c1-300 | awk '{printf "%s%%0A", $0}')
            TAILTXT=$(tail -n 15 build.log | tr -d '\r' | cut -c1-300 | awk '{printf "%s%%0A", $0}')
            echo "::error title=xcodebuild failed rc=$RC::$ERRS$TAILTXT"
            exit $RC
          fi
          echo "===== BUILD OK scheme=$SCHEME ====="
          tail -n 20 build.log
          APPFOUND=$(find platforms/ios/build-dd/Build/Products -name "*.app" -type d 2>/dev/null | head -n 1)
          if [ -z "$APPFOUND" ]; then
            echo "::error title=build ok but no .app produced::scheme=$SCHEME%0A$(find platforms/ios/build-dd/Build/Products -maxdepth 3 2>/dev/null | head -n 30 | tr -d '\r' | awk '{printf "%s%%0A", $0}')"
            exit 1
          fi
          echo "APPFOUND=$APPFOUND"

      - name: Diagnose build output
        if: always()
        run: |
          set +e
          echo "=== build.log size ==="
          wc -c build.log 2>/dev/null || echo "no build.log"
          echo "=== Products 目录 ==="
          ls -la platforms/ios/build-dd/Build/Products 2>/dev/null || echo "no build-dd Products"
          echo "=== build-dd 顶层 ==="
          ls -la platforms/ios/build-dd 2>/dev/null || echo "no build-dd"
          echo "=== 全仓库 .app ==="
          find . -name "*.app" -type d 2>/dev/null | head -n 60
          echo "=== xcarchive ==="
          find . -name "*.xcarchive" -type d 2>/dev/null | head -n 10
          TREE=$(find platforms/ios/build-dd/Build/Products -maxdepth 3 2>/dev/null | head -n 40 | tr -d '\r' | awk '{printf "%s%%0A",$0}')
          HITS=$(find . -name "*.app" -type d 2>/dev/null | head -n 20 | tr -d '\r' | awk '{printf "%s%%0A",$0}')
          LOGTAIL=$(tail -n 80 build.log 2>/dev/null | tr -d '\r' | cut -c1-400 | awk '{printf "%s%%0A",$0}')
          LISTTAIL=$(tail -n 25 list.log 2>/dev/null | tr -d '\r' | cut -c1-400 | awk '{printf "%s%%0A",$0}')
          echo "::warning title=products tree::$TREE"
          echo "::warning title=app hits::$HITS"
          echo "::warning title=list.log tail::$LISTTAIL"
          echo "::error title=build.log tail80::$LOGTAIL"

      - name: Package unsigned .app
        run: |
          set -e
          APP=$(find . -name "*.app" -type d 2>/dev/null | grep -v "/Pods/" | head -n 1)
          if [ -z "$APP" ]; then
            echo "未找到 .app 产物"
            find . -name "*.app" -type d | head -n 40
            MSG=$(find platforms/ios/build-dd -maxdepth 4 2>/dev/null | head -n 30 | tr -d '\r' | awk '{printf "%s%%0A",$0}')
            echo "::error title=no .app found::$MSG"
            exit 1
          fi
          echo "APP=$APP"
          du -sh "$APP"
          ditto -c -k --sequesterRsrc --keepParent "$APP" MusicPlayer-unsigned.zip
          ls -lh MusicPlayer-unsigned.zip

      - name: Upload unsigned artifact
        uses: actions/upload-artifact@v4
        with:
          name: MusicPlayer-unsigned
          path: MusicPlayer-unsigned.zip
          retention-days: 14

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: |
            build.log
            list.log
            uploads.txt
          retention-days: 7
          if-no-files-found: ignore

  # ---------------------------------------------------------------
  # Job 2（可选）：用 P12 证书 + mobileprovision 做 ad-hoc 签名，直接出 .ipa
  # 未配置 secret 时本 job 会自动跳过，不影响 Job 1
  # 需要的 secrets：P12_BASE64 / P12_PASSWORD / MOBILEPROVISION_BASE64
  # ---------------------------------------------------------------
  sign-ipa:
    name: Sign IPA (optional)
    needs: build-unsigned
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      P12_BASE64: ${{ secrets.P12_BASE64 }}
      P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
      MOBILEPROVISION_BASE64: ${{ secrets.MOBILEPROVISION_BASE64 }}

    steps:
      - name: Check signing secrets
        id: check
        run: |
          if [ -n "$P12_BASE64" ] && [ -n "$MOBILEPROVISION_BASE64" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "签名 secret 已配置，继续执行"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "未配置 P12_BASE64 / MOBILEPROVISION_BASE64，跳过签名 job"
          fi

      - name: Download unsigned artifact
        if: steps.check.outputs.enabled == 'true'
        uses: actions/download-artifact@v4
        with:
          name: MusicPlayer-unsigned
          path: unsigned

      - name: Unzip .app
        if: steps.check.outputs.enabled == 'true'
        run: |
          set -e
          cd unsigned
          unzip -q MusicPlayer-unsigned.zip
          APP=$(find . -maxdepth 2 -name "*.app" -type d | head -n 1)
          echo "APP=$APP"
          echo "APP_PATH=$PWD/${APP#./}" >> "$GITHUB_ENV"

      - name: Import certificate & provisioning profile
        if: steps.check.outputs.enabled == 'true'
        run: |
          set -e
          KEYCHAIN=$RUNNER_TEMP/sign.keychain-db
          KEYCHAIN_PASS=$(openssl rand -base64 24)

          echo "$P12_BASE64" | base64 -D > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN"
          security set-keychain-settings -lut 1800 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$P12_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASS" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db

          echo "$MOBILEPROVISION_BASE64" | base64 -D > "$RUNNER_TEMP/profile.mobileprovision"
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp "$RUNNER_TEMP/profile.mobileprovision" ~/Library/MobileDevice/Provisioning\ Profiles/

          # 导出 provisioning profile 内的 entitlements（含 application-identifier / get-task-allow）
          security cms -D -i "$RUNNER_TEMP/profile.mobileprovision" > "$RUNNER_TEMP/profile.plist"
          plutil -extract Entitlements xml1 -o "$RUNNER_TEMP/entitlements.plist" "$RUNNER_TEMP/profile.plist"

          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN" | head -n 1 | awk '{print $2}')
          echo "签名身份: $IDENTITY"
          echo "CODESIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
          echo "KEYCHAIN_PATH=$KEYCHAIN" >> "$GITHUB_ENV"

      - name: Embed profile & codesign
        if: steps.check.outputs.enabled == 'true'
        run: |
          set -e
          cp "$RUNNER_TEMP/profile.mobileprovision" "$APP_PATH/embedded.mobileprovision"
          # --deep 会把 App 内嵌的 NodeMobile.framework 等一并重签
          codesign --force --deep --timestamp=none --sign "$CODESIGN_IDENTITY" \
            --entitlements "$RUNNER_TEMP/entitlements.plist" "$APP_PATH"
          # 校验签名结果
          codesign -dv --verbose=4 "$APP_PATH" 2>&1 | head -n 20
          codesign --verify --deep --verbose=2 "$APP_PATH"

      - name: Build .ipa
        if: steps.check.outputs.enabled == 'true'
        run: |
          set -e
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -qry MusicPlayer-signed.ipa Payload
          ls -lh MusicPlayer-signed.ipa

      - name: Upload signed IPA
        if: steps.check.outputs.enabled == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: MusicPlayer-ipa
          path: MusicPlayer-signed.ipa
          retention-days: 14

      - name: Cleanup keychain
        if: always()
        run: |
          if [ -n "$KEYCHAIN_PATH" ]; then security delete-keychain "$KEYCHAIN_PATH" || true; fi
